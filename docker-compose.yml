# OpenReply — Local Development Services
# Run: docker-compose up -d

services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_DATABASE: openreply
      MYSQL_ROOT_PASSWORD: mysql
    ports:
      # Host port 3307, not 3306 — 3306 is already taken by an unrelated
      # container on this machine (pg_tenant_db, a different project).
      - "3307:3306"
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pmysql"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  mysqldata:
  redisdata:
